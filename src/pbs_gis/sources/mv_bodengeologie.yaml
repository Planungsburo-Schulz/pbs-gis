name: mv_bodengeologie
description: "Bodengeologie MV — Moore, Feldkapazität, Durchwurzelungstiefe, Nitratauswaschung, Bodenfunktionsbereiche"
tags: [boden, bodengeologie, moor, moore, feldkapazität, nitrat, MV, mecklenburg-vorpommern]

connection:
  type: wfs
  url: "https://umweltkarten.lung-mv.de/dienste/gb_boden"
  version: "1.1.0"
  # Der Dienst wertet eine BBOX nur in seiner Standard-Projektion EPSG:5650
  # aus (auch mit EPSG:25833-Zusatz: 0 Treffer); gelesen wird darum in 5650,
  # der Hook liefert EPSG:25833.
  crs: "EPSG:5650"
  bbox_kvp: false

hooks: lung_demojibake.py
ausgabe_crs: "EPSG:25833"

layers:
  moore:
    wfs_layer: "kbk25_kb"
    title: "Kohlenstoffreiche Böden inkl. Moore (KBK25)"
    tags: [moor, moore, kohlenstoff, torf, niedermoor, hochmoor, anmoor, KBK25]
    # Source: LUNG M-V, KBK25_KB Attributtabelle (Stand 09/2022)
    attribute_mappings:
      EINHEIT_:
        "1.4": "Gleye über Niedermoor, selten Erd- bis Mulmniedermoore"
        "1.5": "Gleye über Niedermoor aus Auensand bis -schluff, selten Erd- bis Mulmniedermoore"
        "3": "Erd- bis Mulmniedermoore mit Strandsandlagen über marinem Sand"
        "3.1": "Erd- bis Mulmniedermoore (flachgründig) mit Strandsandlagen über marinem Sand"
        "3.1.2": "Erd- bis Mulmniedermoore (flachgründig) mit Strandsandlagen über Lehm bis Ton"
        "3.2": "Erd- bis Mulmniedermoore (tiefgründig) mit Strandsandlagen"
        "3.2.1.1": "Erd- bis Mulmniedermoore (tiefgründig) aus Niedermoortorf über Mudde"
        "4": "Erd- bis Mulmniedermoore über Sand bis Ton und Mudde"
        "4.1": "Erd- bis Mulmniedermoore (flachgründig) über Sand bis Ton und Mudde"
        "4.1.1": "Erd- bis Mulmniedermoore (flachgründig) über Sand und Mudde"
        "4.1.2": "Erd- bis Mulmniedermoore (flachgründig) über Lehm bis Ton und Mudde"
        "4.2": "Erd- bis Mulmniedermoore (tiefgründig)"
        "4.3": "Erd- bis Mulmniedermoore aus Niedermoortorf über Kalkmudde"
        "49": "Erd- bis Mulmniedermoore über marinem Sand oder Dünensand"
        "5": "Erd- bis Mulmniedermoore, selten Moorgleye aus flachem Niedermoortorf"
        "5.1": "Erd- bis Mulmniedermoore (flachgründig) über Sand bis Ton"
        "5.1.1": "Erd- bis Mulmniedermoore (flachgründig) über Sand"
        "5.1.2": "Erd- bis Mulmniedermoore (flachgründig) über Lehm bis Ton"
        "5.2": "Erd- bis Mulmniedermoore (tiefgründig), selten Kolluvisole"
        "5.3": "Erd- bis Mulmniedermoore aus Niedermoortorf über Kalkmudde"
        "6": "Hochmoore und Hochmoore über Niedermoor"
        "6.1": "Übergangsmoore aus Übergangsmoortorf"
        "5.4": "Kolluvisole, Kolluvisol-Gleye über tiefem Niedermoor"
        "5.5": "Anmoorgleye, Niedermoore, Erdniedermoore"
        "5.6": "Flache Gleye, Humusgleye, flache Anmoorgleye, Regosole aus Seesand"
        "52.1": "Moorgleye aus flachem Niedermoortorf über Seesand"
        "54": "Moorgleye aus flachem Niedermoortorf über marinen Ablagerungen (Schlick)"
    column_mapping:
      EINHEIT_: einheit
      EINHEIT__lbl: bezeichnung

  feldkapazitaet:
    wfs_layer: "fk_100"
    title: "Feldkapazität (100 cm)"
    tags: [boden, feldkapazität, wasser]

  nutzbare_feldkapazitaet:
    wfs_layer: "nfk_100"
    title: "Nutzbare Feldkapazität (100 cm)"
    tags: [boden, feldkapazität, nutzbar, wasser]

  luftkapazitaet:
    wfs_layer: "lk_100"
    title: "Luftkapazität (100 cm)"
    tags: [boden, luftkapazität]

  durchwurzelungstiefe:
    wfs_layer: "we"
    title: "Effektive Durchwurzelungstiefe"
    tags: [boden, durchwurzelungstiefe, wurzel]

  nitratauswaschung:
    wfs_layer: "nag"
    title: "Potentielle Nitratauswaschungsgefährdung"
    tags: [boden, nitrat, auswaschung, grundwasser]

  bodenfunktionsbereiche:
    wfs_layer: "bfb"
    title: "Bodenfunktionsbereiche"
    tags: [boden, bodenfunktion]
