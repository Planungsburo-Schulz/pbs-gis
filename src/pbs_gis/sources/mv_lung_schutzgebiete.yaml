name: mv_lung_schutzgebiete
description: "MV Schutzgebiete — LUNG-WFS ng_schutzgebiete: NSG, LSG, FFH, SPA, Nationalpark, Naturpark, Biosphärenreservat, Flächennaturdenkmale. Ausgabe in EPSG:25833; ein von Hand übergebener `extent` gilt in der Ausgabe-Projektion EPSG:25833 (`ausgabe_crs`) und wird in die Dienst-Projektion EPSG:5650 umgerechnet, `input_boundary` wird automatisch umprojiziert. Geschützte Landschaftsbestandteile und Naturdenkmale als Punkte führt der Dienst nicht."
tags: [schutzgebiet, naturschutz, nsg, lsg, ffh, spa, natura2000, nationalpark, naturpark, biosphaerenreservat, naturdenkmal, MV, mecklenburg-vorpommern, LUNG]

connection:
  type: wfs
  url: "https://umweltkarten.lung-mv.de/dienste/ng_schutzgebiete"
  version: "1.1.0"
  crs: "EPSG:5650"
  bbox_kvp: false

hooks: lung_demojibake.py
ausgabe_crs: "EPSG:25833"

layers:
  nsg:
    wfs_layer: "nsg_f"
    title: "Naturschutzgebiete"
    tags: [nsg, naturschutzgebiet]

  lsg:
    wfs_layer: "lsg_f"
    title: "Landschaftsschutzgebiete"
    tags: [lsg, landschaftsschutzgebiet]

  ffh:
    wfs_layer: "ffhmv_f"
    title: "FFH-Gebiete"
    tags: [ffh, natura2000]

  spa:
    wfs_layer: "spamv_f"
    title: "EU-Vogelschutzgebiete (SPA)"
    tags: [spa, vogelschutz, natura2000]

  nationalpark:
    wfs_layer: "nlp_f"
    title: "Nationalparke"
    tags: [nationalpark, nlp]

  naturpark:
    wfs_layer: "np_f"
    title: "Naturparke"
    tags: [naturpark, np]

  biosphaerenreservat:
    wfs_layer: "brn_f"
    title: "Biosphärenreservate"
    tags: [biosphärenreservat, biosphaere]

  naturdenkmal_flaeche:
    wfs_layer: "fnd_f"
    title: "Flächennaturdenkmale"
    tags: [fnd, naturdenkmal, fläche]
